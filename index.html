<!DOCTYPE html>
<html lang="es">
<head>

  <title>Proyecto 8: Image Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="galeria">
    <figure class="img img_1">
      <img src="img/jack1.jfif" alt="Playa con niebla y una gran formación rocosa en primer plano">

    <figure class="img img_2">
      <img src="img/JackS_1.jfif" alt="Mesa con platos y tazones de comida">

    <figure class="img img_3">

    <figure class="img img_4">
      <img src="img/JackS_4.jfif" alt="Sala con sofá blanco y ventana redonda">

    <figure class="img img_5">

    </figure>

      <img src="img/JackS_6.jpg" alt="Vista de una playa desde lo alto de una colina">

</html>
